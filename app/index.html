<style>
/* Layout: one-handed phone app, two bottom tabs, a pre-dawn marsh palette readable in a dark blind. Single dark look by choice. */
:root{
  color-scheme:dark;
  --mud:#0E1209; --reed:#191F12; --reed2:#242C1A; --line:#3F4A30; --field:#69755A;
  --bone:#F0EBDB; --straw:#BABDA5; --dim:#8A8F79;
  --mallard:#1F5A43; --rust:#55241B; --rust-hi:#F7B3A2;
  --markbg:rgba(240,235,219,.14); --markbg-pick:rgba(28,13,2,.2);
  --blaze:#FF7A1F; --blaze-ink:#1C0D02;
  --scrim:rgba(5,7,3,.72);
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
body{background:var(--mud);color:var(--bone);font:400 16px/1.45 var(--body);margin:0}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--mud)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:not(:disabled):active,.btn:active,.call:active{filter:brightness(1.2)}
a{color:inherit}
:focus-visible{outline:3px solid var(--blaze);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--mud);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.mark{font:900 26px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;min-width:0}
.mark small{display:block;font:500 12px/1.3 var(--body);letter-spacing:.04em;color:var(--straw);text-transform:none;margin-top:2px}
.call{display:inline-flex;align-items:center;min-height:44px;font-weight:700;font-size:15px;text-decoration:none;border:1px solid var(--line);padding:0 14px;border-radius:4px;white-space:nowrap}
main{padding-block:16px 150px;display:grid;gap:20px}
main>*{min-width:0}
h1,h2,h3{margin:0;font-family:var(--display);text-transform:uppercase;letter-spacing:.015em;line-height:1.05;text-wrap:balance}
h1{font-weight:900;font-size:36px}
h2{font-weight:800;font-size:26px}
h3{font-weight:800;font-size:20px}
p{margin:0}
.mute{color:var(--straw)}
.small{font-size:14px}
.stack{display:grid;gap:10px}
.stack.tight{gap:4px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}
.panel{background:var(--reed);border:1px solid var(--line);border-radius:6px;padding:14px;display:grid;gap:10px}
.note{border:1px solid var(--line);border-left:4px solid var(--blaze);padding:10px 12px;font-size:14px;display:grid;gap:8px;background:var(--reed)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 16px;border-radius:4px;font-weight:700;text-decoration:none;text-align:center;border:1px solid var(--line);background:var(--reed2)}
.btn.primary{background:var(--blaze);border-color:var(--blaze);color:var(--blaze-ink)}
.btn.wide{width:100%}
.btn:disabled{opacity:.6;cursor:default}
.btn.sm{min-height:44px;padding:0 12px;font-size:14px}
.btn.on{background:var(--blaze);border-color:var(--blaze);color:var(--blaze-ink)}
.link{display:inline-flex;align-items:center;min-height:44px;text-decoration:underline;text-underline-offset:3px;color:var(--straw);font-size:14px}
.link.tight{min-height:30px}
label{font-weight:600;font-size:14px;display:grid;gap:6px}
input[type=text],input[type=email],input[type=password],select,textarea{width:100%;min-height:46px;background:var(--mud);border:1px solid var(--field);border-radius:4px;padding:10px 12px;font-size:16px;font-weight:500}
::placeholder{color:var(--dim);opacity:1}
textarea{min-height:96px;resize:vertical}
.err{color:var(--rust-hi);font-size:14px;font-weight:600}
.steps{margin:0;padding-left:22px;display:grid;gap:8px}

/* Install */
.installbar{display:flex;align-items:center;gap:8px;background:var(--reed);border:1px solid var(--line);border-radius:6px;padding:10px 4px 10px 12px}
.installbar b{display:block;font-weight:700;line-height:1.25}
.installbar span{display:block;font-size:13px;color:var(--straw);line-height:1.3}
.installbar .btn{white-space:nowrap;flex:none}
.dismiss{width:36px;height:44px;font-size:22px;line-height:1;color:var(--straw);flex:none}

/* Calendar */
.opener{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.opener>div{min-width:0}
.opener b{font:900 44px/.95 var(--display);text-transform:uppercase;display:block}
.opener .days{font:800 20px/1.05 var(--display);color:var(--blaze);text-transform:uppercase;text-align:right;white-space:nowrap;flex:none}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--straw)}
.legend>span{display:inline-flex;align-items:center;gap:6px}
.swatch{width:14px;height:14px;border-radius:2px;display:inline-block;background:var(--mallard)}
.swatch.part,.d.part{background:linear-gradient(135deg,var(--mallard) 0 50%,var(--rust) 50% 100%)}
.swatch.full{background:var(--rust)}
.swatch.ring{outline:2px solid var(--blaze);outline-offset:-2px}
.month{display:grid;gap:8px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:12px;font-weight:600;color:var(--dim);text-align:center}
.d{aspect-ratio:1;display:flex;flex-direction:column;gap:2px;align-items:center;justify-content:center;border-radius:3px;font-weight:700;font-size:15px;line-height:1.1;font-variant-numeric:tabular-nums;width:100%;min-width:0;overflow:hidden}
.d:focus-visible{outline-offset:-3px}
.marks{display:flex;gap:2px;font:700 11px/1 var(--body);text-decoration:none}
.legend .marks{font-size:12px}
.marks i{font-style:normal;padding:1px 2px;border-radius:2px;background:var(--markbg)}
.marks i.x{text-decoration:line-through;background:none;opacity:.8}
.d.closed{color:var(--dim);font-weight:500}
button.d:disabled{cursor:default}
.d[aria-current=date]{box-shadow:inset 0 0 0 1px var(--straw)}
.d.open{background:var(--mallard);color:var(--bone)}
.d.part{color:var(--bone)}
.d.booked{background:var(--rust);color:var(--rust-hi)}
.d.none{border:1px dashed var(--line);color:var(--straw)}
.d.pick{background:var(--blaze);color:var(--blaze-ink);font-weight:800}
.d.pick .marks i{background:var(--markbg-pick)}
.d.opening{outline:2px solid var(--blaze);outline-offset:-2px}
.d.pick.opening{outline-color:var(--bone)}
.splits{display:grid;gap:0;border-top:1px solid var(--line)}
.splits>*{display:flex;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:10px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.splits b{font-weight:600;flex:none}
.splits i{font-style:normal;color:var(--straw);text-align:right}
button.rowlink{min-height:44px;align-items:center}
.pickbar{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--reed2);border-top:1px solid var(--line)}
.pickbar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.pickbar b{font:800 22px/1 var(--display);text-transform:uppercase;display:block}

/* Hunts in a day */
.hunt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.hunt>div{min-width:0}
.hunt b{display:block;font-weight:700}
.hunt .sub{color:var(--straw);font-size:14px}
.hunt.isbooked b{color:var(--straw)}
.pill{font-size:13px;font-weight:700;padding:5px 9px;border-radius:3px;background:var(--rust);color:var(--rust-hi);white-space:nowrap}
.hedit{grid-column:1/-1;display:grid;gap:10px;background:var(--reed2);padding:12px;border-radius:4px}
.fieldname{font-weight:600;font-size:14px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{min-height:44px;font-weight:600;font-size:14px;color:var(--straw);border-right:1px solid var(--line);padding:0 4px}
.seg button:last-child{border-right:0}
.seg button:focus-visible{outline-offset:-3px}
.seg button[aria-pressed=true]{background:var(--bone);color:var(--mud);font-weight:700}
.seg button:disabled{opacity:.35;cursor:default}
.seg.status{min-width:136px}

/* Tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--mud);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:1fr 1fr}
nav.tabs button{height:60px;font:800 20px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;color:var(--straw);border-top:3px solid transparent}
nav.tabs button[aria-current=page]{color:var(--bone);border-top-color:var(--blaze)}

/* Duck club */
.blindcard{background:var(--reed);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;gap:12px}
.bignum{display:flex;align-items:baseline;gap:12px;font:900 clamp(110px,38vw,150px)/.86 var(--display);color:var(--blaze);text-transform:uppercase;letter-spacing:-.005em}
.bignum .unit{font-size:42px;font-weight:800;color:var(--bone)}
.bignum.none{font-size:52px;line-height:1;color:var(--straw)}
.datenav{display:grid;grid-template-columns:46px 1fr 46px;align-items:center;gap:6px;text-align:center}
.datenav button{height:46px;border:1px solid var(--line);border-radius:4px;font-size:20px;font-weight:700;background:var(--reed2)}
.datenav button:disabled{opacity:.35;cursor:default}
.datenav b{font:800 22px/1.05 var(--display);text-transform:uppercase}
.blind{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.blind .n{font:900 32px/1 var(--display);text-align:center;font-variant-numeric:tabular-nums}
.blind .cap{display:block;font:600 12px/1 var(--body);color:var(--straw);margin-top:3px;font-variant-numeric:tabular-nums;white-space:nowrap}
.blind .cap.over{color:var(--rust-hi)}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.chip{min-height:40px;padding:4px 10px;border-radius:3px;background:var(--reed2);border:1px solid var(--line);font-weight:600;font-size:14px;text-align:left;overflow-wrap:anywhere}
.chip.today{border-color:var(--blaze);color:var(--blaze)}
.chip.ex{border-style:dashed}
.empty{color:var(--dim);font-size:14px}
.plus{width:44px;height:44px;border:1px solid var(--line);border-radius:4px;font-size:24px;font-weight:600;background:var(--reed2)}
.stepper{display:inline-flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;border:1px solid var(--line);border-radius:4px;font-size:20px;font-weight:700;background:var(--reed2)}
.stepper b{font:800 24px/1 var(--display);min-width:28px;text-align:center}
.who{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;min-height:50px;padding:8px 2px;border-bottom:1px solid var(--line);text-align:left;font-weight:600}
.who>span:first-child{min-width:0;overflow-wrap:anywhere}
.who>span:last-child{font-weight:500;font-size:14px;color:var(--straw);white-space:nowrap}
.who[aria-pressed=true]>span:last-child{color:var(--blaze);font-weight:700}
.code{font:800 26px/1.1 var(--display);letter-spacing:.04em;overflow-wrap:anywhere;user-select:all}
.price{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:8px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
.price b{font-weight:600}
.price em{font-style:normal;font-weight:700}
.price span{grid-column:1/-1;color:var(--straw);font-size:14px}

/* Sheet + toast */
.scrim{position:fixed;inset:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--reed);border-top:3px solid var(--blaze);width:100%;max-width:520px;max-height:84%;overflow:auto;overscroll-behavior:contain;display:grid;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet:focus{outline:none}
.sheet>*{min-width:0}
.pick-blinds{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pick-blinds button{min-height:56px;border:1px solid var(--line);border-radius:4px;background:var(--reed2);display:grid;place-content:center;gap:2px}
.pick-blinds b{font:900 24px/1 var(--display)}
.pick-blinds small{font-size:11px;color:var(--straw);font-variant-numeric:tabular-nums}
.pick-blinds button[aria-pressed=true]{background:var(--blaze);color:var(--blaze-ink);border-color:var(--blaze)}
.pick-blinds button[aria-pressed=true] small{color:var(--blaze-ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);width:max-content;top:calc(72px + env(safe-area-inset-top,0px));z-index:30;background:var(--bone);color:var(--mud);font-weight:600;font-size:14px;padding:9px 14px;border-radius:4px;max-width:calc(100% - 32px);text-align:center}
.toast button{text-decoration:underline;font-weight:700;min-height:28px;margin-left:4px}
@media (prefers-reduced-motion:no-preference){.sheet:not(.noanim){animation:up .16s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

<div id="app"></div>
<div id="live" class="toast" role="status" aria-live="polite" hidden></div>
<noscript><p style="padding:16px">The Roost Hole Guide Service. Call or text Jonathon at 870-830-3633.</p></noscript>

<script>
/* ---------- The Roost Hole app ---------- */
const PHONE='+18708303633', PHONE_TXT='870-830-3633';
const SITE='https://theroostholeguideservice.com';
const OWNER_ACCOUNT='owner@theroostholeguideservice.com'; // Owners never see this. They only type the owner code, which is this account's password.
const HOSTED=!!window.ROOST_HOSTED, CONFIG=window.ROOST_CONFIG||{};

/* Season dates. On the website these live in config.js, so they can change each year without touching this file.
   Source: Arkansas Game and Fish Commission, 2026-27. */
const DUCK_AND_GOOSE=CONFIG.duckAndGooseDates||[['2026-11-21','2026-11-29'],['2026-12-10','2026-12-23'],['2026-12-26','2027-01-31']];
const GOOSE_ONLY=CONFIG.gooseOnlyDates||[['2026-10-31','2026-11-08']];
const SPLIT_NAMES=['First split','Second split','Third split'];

/* Kinds of hunts. A hunt's hour is when a same-day hunt stops being offered to customers. */
const TIMES={Morning:5,Midday:10,Afternoon:13};
const SPECIES={
  duck:{label:'Duck',mark:'D',name:'duck'},
  goose:{label:'Goose',mark:'G',name:'goose'},
  both:{label:'Both',mark:'B',name:'duck and goose'}
};
const SETUPS=['Flooded rice','Field spread','Layout'];
const USUAL_DAY=[{id:'u1',time:'Morning',species:'duck',setup:'Flooded rice'},{id:'u2',time:'Morning',species:'goose',setup:'Field spread'}];
const CAPACITY=6, DEFAULT_BLINDS=16, MAX_BLINDS=99;

/* Dates are always local and stored as YYYY-MM-DD */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const fmt=(s,o={weekday:'short',month:'short',day:'numeric'})=>parse(s).toLocaleDateString('en-US',o);
const monthDay=s=>fmt(s,{month:'short',day:'numeric'});
const today=()=>iso(new Date());
function expand(ranges){
  const out=[];
  for(const[from,to]of ranges){for(const d=parse(from);iso(d)<=to;d.setDate(d.getDate()+1))out.push(iso(d))}
  return out;
}
const duckDays=expand(DUCK_AND_GOOSE);
const gooseOnlyDays=expand(GOOSE_ONLY);
const huntDays=[...new Set([...gooseOnlyDays,...duckDays])].sort();
const MONTHS=[...new Set(huntDays.map(d=>d.slice(0,7)))].map(k=>{const[y,m]=k.split('-').map(Number);return[y,m-1]});
const legal=(species,d)=>d==='usual'||(species==='goose'?huntDays.includes(d):duckDays.includes(d));
const nextDuckDay=()=>duckDays.find(d=>d>=today())||duckDays[duckDays.length-1];

/* Small helpers */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={
  get(k,f=null){try{const v=localStorage.getItem('roost.'+k);return v==null?f:JSON.parse(v)}catch(e){return f}},
  set(k,v){try{v==null?localStorage.removeItem('roost.'+k):localStorage.setItem('roost.'+k,JSON.stringify(v))}catch(e){}}
};
const timed=(p,ms=10000)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms))]);
function normCode(s){
  const up=String(s||'').trim().toUpperCase();
  const found=up.match(/[A-Z]+-\d{4,}/); // Works if someone pastes the whole text message.
  return found?found[0]:up.replace(/\s+/g,'-');
}
function newCode(){
  const words=['GREENHEAD','PINTAIL','GADWALL','WIDGEON','MALLARD','DRAKE'];
  const r=crypto.getRandomValues(new Uint32Array(2));
  return words[r[0]%words.length]+'-'+String(100000+r[1]%900000);
}
const newId=()=>'m'+Array.from(crypto.getRandomValues(new Uint8Array(6)),b=>b.toString(16).padStart(2,'0')).join('');
const appUrl=()=>HOSTED?location.href.split(/[?#]/)[0]:SITE+'/app/';
const whenText=ms=>ms?new Date(ms).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'';

/* Saved data shapes. Anything missing or left over from an earlier version gets cleaned up here. */
const SAFE_ID=/^[\w-]+$/;
const emptyClub=()=>({blinds:DEFAULT_BLINDS,members:[],season:{},days:{}});
function normalizeClub(c){
  c=c||{};
  const members=(Array.isArray(c.members)?c.members:[]).filter(m=>m&&SAFE_ID.test(m.id)&&typeof m.name==='string');
  return {blinds:Number(c.blinds)||DEFAULT_BLINDS,members,season:c.season||{},days:c.days||{}};
}
function cleanHunts(list){
  return (Array.isArray(list)?list:[]).filter(h=>h&&SAFE_ID.test(h.id)&&SPECIES[h.species])
    .map(h=>({...h,time:Object.prototype.hasOwnProperty.call(TIMES,h.time)?h.time:'Morning',setup:h.setup||''}));
}
function normalizePub(p){
  p=p||{};
  const usual=p.usual?cleanHunts(p.usual):USUAL_DAY.map(h=>({...h}));
  const days={};
  for(const[d,list]of Object.entries(p.days||{}))days[d]=cleanHunts(list);
  for(const d of p.booked||[]){ // The first version booked whole days.
    if(!days[d])days[d]=usual.filter(h=>legal(h.species,d)).map(h=>({...h,status:'booked'}));
  }
  return {usual,days};
}

/* ---------- Where shared data lives ----------
   Three interchangeable stores with the same get / set / del calls.
   Paths: public/site (calendar, anyone reads), clubs/<code> (blinds, need the code), owner/settings (owner only). */
function demoStore(){
  return {kind:'demo',needsSignIn:true,
    isOwner(){return !!LS.get('demoOwner')},
    async signIn(){LS.set('demoOwner',true)},
    async signOut(){LS.set('demoOwner',null)},
    async get(p){return LS.get('demo:'+p)},
    async set(p,o){LS.set('demo:'+p,o)},
    async del(p){LS.set('demo:'+p,null)}};
}
function artifactStore(db,canEdit){
  const copy=o=>JSON.parse(JSON.stringify(o)); // What the database hands back is frozen, so the app works on a copy.
  return {kind:'shared',needsSignIn:false,
    isOwner(){return canEdit},
    async signIn(){},
    async signOut(){},
    async get(p){const s=await db.doc(p).get();return s.exists?copy(s.data()):null},
    async set(p,o){await db.doc(p).set(copy(o))},
    async del(p){await db.doc(p).delete()}};
}
function firebaseStore(cfg){
  const base=`https://firestore.googleapis.com/v1/projects/${cfg.projectId}/databases/(default)/documents`;
  let auth=LS.get('auth');
  const keep=a=>{auth=a;LS.set('auth',a)};
  const fail=(what,r)=>{const e=new Error(what);e.status=r.status;return e};
  async function token(){
    if(!auth)return null;
    if(Date.now()<auth.exp-60000)return auth.idToken;
    const r=await fetch(`https://securetoken.googleapis.com/v1/token?key=${cfg.apiKey}`,{
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(auth.refreshToken)
    });
    if(!r.ok){
      if(r.status>=400&&r.status<500)keep(null); // The sign-in was revoked, so the owner has to sign in again.
      throw fail('auth',r);
    }
    const j=await r.json();
    keep({idToken:j.id_token,refreshToken:j.refresh_token,exp:Date.now()+Number(j.expires_in)*1000});
    return auth.idToken;
  }
  const authHeader=async()=>{const t=await token();return t?{Authorization:'Bearer '+t}:{}};
  const seen={}; // When each document last changed, as of this phone's last read.
  async function commit(write){ // The same call Google's own web library makes for writes.
    const headers={'Content-Type':'application/json',...(await authHeader())};
    const r=await fetch(`${base}:commit?key=${cfg.apiKey}`,{method:'POST',headers,body:JSON.stringify({writes:[write]})});
    if(!r.ok){
      const e=fail('write',r), why=await r.json().catch(()=>({}));
      e.conflict=['FAILED_PRECONDITION','ABORTED','ALREADY_EXISTS','NOT_FOUND'].includes(why.error&&why.error.status);
      throw e;
    }
    return r.json();
  }
  const docName=p=>`projects/${cfg.projectId}/databases/(default)/documents/${p}`;
  return {kind:'shared',needsSignIn:true,
    isOwner(){return !!auth},
    async signIn(code){
      const r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${cfg.apiKey}`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email:OWNER_ACCOUNT,password:code,returnSecureToken:true})
      });
      if(!r.ok)throw new Error('signin');
      const j=await r.json();
      keep({idToken:j.idToken,refreshToken:j.refreshToken,exp:Date.now()+Number(j.expiresIn)*1000});
    },
    async signOut(){keep(null)},
    async get(p){
      const r=await fetch(`${base}/${p}?key=${cfg.apiKey}`,{headers:await authHeader()});
      if(r.status===404){seen[p]=null;return null}
      if(!r.ok)throw fail('read',r);
      const j=await r.json();
      seen[p]=j.updateTime;
      return JSON.parse(j.fields.json.stringValue);
    },
    async set(p,o,onlyIfUnchanged){
      const write={update:{name:docName(p),fields:{json:{stringValue:JSON.stringify(o)}}}};
      if(onlyIfUnchanged&&p in seen)write.currentDocument=seen[p]?{updateTime:seen[p]}:{exists:false};
      const j=await commit(write);
      seen[p]=j.writeResults&&j.writeResults[0]&&j.writeResults[0].updateTime||seen[p];
    },
    del(p){return commit({delete:docName(p)})}};
}
async function pickStore(){
  if(window.claude&&window.claude.use){
    const db=await window.claude.use('db');
    if(!db)return demoStore();
    const user=await window.claude.use('user');
    return artifactStore(db,user?!!(await user.canEdit()):false);
  }
  const f=CONFIG.firebase;
  return f&&f.apiKey&&f.projectId?firebaseStore(f):demoStore();
}

/* Hunts on a day: the owner's changes for that day, or the usual day. Only legal hunts ever show. */
const byTime=(a,b)=>Object.keys(TIMES).indexOf(a.time)-Object.keys(TIMES).indexOf(b.time);
const huntsOn=d=>(S.pub.days[d]||S.pub.usual).filter(h=>legal(h.species,d)).map(h=>({status:'open',...h})).sort(byTime);
const started=(d,h)=>d===today()&&new Date().getHours()>=TIMES[h.time];
const offered=d=>huntsOn(d).filter(h=>!started(d,h));
const matchF=h=>S.filter==='all'||h.species===S.filter||h.species==='both';
const huntName=h=>`${h.time} ${SPECIES[h.species].name} hunt`;
function labelled(hunts){ // Two identical hunts on one day get numbered so they can be told apart.
  const total={},seen={},key=h=>h.time+h.species;
  hunts.forEach(h=>{total[key(h)]=(total[key(h)]||0)+1});
  return hunts.map(h=>{
    seen[key(h)]=(seen[key(h)]||0)+1;
    return {...h,label:huntName(h)+(total[key(h)]>1?` ${seen[key(h)]}`:'')};
  });
}
function dayList(d){ // Changing a day gives it its own copy of the usual hunts.
  if(d==='usual')return S.pub.usual;
  if(!S.pub.days[d])S.pub.days[d]=S.pub.usual.filter(h=>legal(h.species,d)).map(h=>({...h,status:'open'}));
  return S.pub.days[d];
}
function tidyDay(d){ // A day that's back to matching the usual day goes back to following it.
  const list=S.pub.days[d];
  if(!list)return;
  const sig=l=>JSON.stringify(l.map(h=>[h.id,h.time,h.species,h.setup||'']));
  if(list.every(h=>h.status!=='booked')&&sig(list)===sig(S.pub.usual.filter(h=>legal(h.species,d))))delete S.pub.days[d];
}
const findHunt=id=>dayList(sheet.d).find(h=>h.id===id);

  savePub();
}

/* Blinds: a hunter's season blind holds unless one day overrides it. 0 means no blind. */
const seasonBlind=id=>(S.club&&S.club.season[id])||0;
const override=(id,day)=>{const d=S.club&&S.club.days[day];return d&&Object.prototype.hasOwnProperty.call(d,id)?d[id]:undefined};
const blindOn=(id,day)=>{if(day==='season')return seasonBlind(id);const o=override(id,day);return o===undefined?seasonBlind(id):o};
const onBlind=(n,day)=>S.club.members.filter(m=>blindOn(m.id,day)===n);
const scopeName=()=>S.scope==='season'?'all season':fmt(S.scope);
function assign(id,n,day=S.scope){
  const c=S.club;
  if(day==='season'){
    if(n)c.season[id]=n;else delete c.season[id];
  }else{
    c.days[day]=c.days[day]||{};
    if(n===seasonBlind(id))delete c.days[day][id];else c.days[day][id]=n;
    if(!Object.keys(c.days[day]).length)delete c.days[day];
  }
  saveClub();
}
function clearOverride(id,day){
  const d=S.club.days[day];
  if(d){delete d[id];if(!Object.keys(d).length)delete S.club.days[day]}
  saveClub();
}
function removeMember(id){
  const c=S.club;
  c.members=c.members.filter(m=>m.id!==id);
  delete c.season[id];
  for(const d of Object.keys(c.days)){delete c.days[d][id];if(!Object.keys(c.days[d]).length)delete c.days[d]}
  if(S.memberId===id)setMember(null);
  saveClub();
}
const setMember=id=>{S.memberId=id;LS.set('member',id)};

/* ---------- Several owners ----------
   Right before saving, the phone re-reads what's stored and folds in anything another owner changed since it last looked.
   Compares three versions: what this phone last read (base), this phone (mine), and what's stored now (theirs).
   Only when two owners changed the very same thing does the later save win. */
const canon=v=>Array.isArray(v)?v.map(canon):v&&typeof v==='object'
  ?Object.keys(v).sort().reduce((o,k)=>{if(v[k]!==undefined)o[k]=canon(v[k]);return o},{}):v;
const same=(a,b)=>JSON.stringify(canon(a))===JSON.stringify(canon(b));
const pick=(b,m,t)=>same(m,b)?t:m;
function mergeMaps(b,m,t,inner=pick){
  const out={};
  b=b||{};m=m||{};t=t||{};
  for(const k of new Set([...Object.keys(t),...Object.keys(m),...Object.keys(b)])){
    const v=inner(b[k],m[k],t[k]);
    if(v!==undefined)out[k]=v;
  }
  return out;
}
const byId=list=>Object.fromEntries((list||[]).map(x=>[x.id,x]));
function mergeList(b,m,t){ // Keeps the stored order and adds anything new at the end.
  const merged=mergeMaps(byId(b),byId(m),byId(t));
  return Object.keys(merged).sort((x,y)=>{
    const rank=k=>{const i=(t||[]).findIndex(h=>h.id===k);return i<0?1e6:i};
    return rank(x)-rank(y);
  }).map(k=>merged[k]);
}
function mergePub(b,m,t){
  const dayOf=(p,d)=>(p.days[d]||p.usual.filter(h=>legal(h.species,d))).map(h=>({status:'open',...h}));
  const usual=pick(b.usual,m.usual,t.usual), days={};
  for(const d of new Set([...Object.keys(b.days),...Object.keys(m.days),...Object.keys(t.days)])){
    days[d]=mergeList(dayOf(b,d),dayOf(m,d),dayOf(t,d));
  }
  return {usual,days};
}
function mergeClub(b,m,t){
  const members=mergeList(b.members,m.members,t.members), known=new Set(members.map(x=>x.id));
  const keepKnown=o=>Object.fromEntries(Object.entries(o).filter(([id])=>known.has(id)));
  const season=keepKnown(mergeMaps(b.season,m.season,t.season));
  const days={};
  for(const[d,v]of Object.entries(mergeMaps(b.days,m.days,t.days,(x,y,z)=>mergeMaps(x,y,z)))){
    const kept=keepKnown(v);
    if(Object.keys(kept).length)days[d]=kept;
  }
  const highest=Math.max(0,...Object.values(season),...Object.values(days).flatMap(Object.values));
  return {blinds:Math.max(pick(b.blinds,m.blinds,t.blinds),highest),members,season,days};
}
const bases={pub:LS.get('base:pub'),club:LS.get('base:club')};
function setBase(kind,value){
  if(!store||!store.isOwner())return;
  bases[kind]=JSON.parse(JSON.stringify(value));
  LS.set('base:'+kind,bases[kind]);
}

/* ---------- Saving ----------
   Unsaved work is remembered on the phone and keeps retrying, so bad signal in the field can't lose a change. */
const PATHS={pub:()=>'public/site',club:()=>'clubs/'+S.code};
const VALUES={pub:()=>S.pub,club:()=>S.club};
const dirty=new Set(LS.get('dirty',[]));
const edits={pub:0,club:0};
let flushing=false, flushT=null, saveFailing=false;
function markDirty(kind){
  edits[kind]++;
  dirty.add(kind);
  LS.set('dirty',[...dirty]);
  clearTimeout(flushT);
  flushT=setTimeout(flush,300);
}
async function saveOne(kind){
  const at=edits[kind], path=PATHS[kind]();
  const raw=await timed(store.get(path));
  if(edits[kind]!==at)return; // Changed again while reading, so start over with the newest.
  if(kind==='club'&&!raw){ // The club isn't under this code anymore. See if another owner changed the code.
    const o=await timed(store.get('owner/settings'));
    if(o&&o.code&&o.code!==S.code){
      S.code=o.code;
      LS.set('code',o.code);
      return;
    }
  }
  if(raw&&bases[kind]){
    const theirs=kind==='pub'?normalizePub(raw):normalizeClub(raw);
    if(!same(theirs,bases[kind])){
      if(kind==='pub'){
        S.pub=mergePub(bases.pub,S.pub,theirs);
        Object.keys(S.pub.days).forEach(tidyDay);
        LS.set('cache:pub',S.pub);
      }else{
        S.club=mergeClub(bases.club,S.club,theirs);
        cacheClub();
      }
      render();
    }
  }
  const snapshot=JSON.parse(JSON.stringify(VALUES[kind]()));
  await timed(store.set(path,snapshot,true));
  setBase(kind,snapshot);
  if(edits[kind]===at){
    dirty.delete(kind);
    LS.set('dirty',[...dirty]);
  }
}
async function flush(){
  if(flushing||!store||!dirty.size||!store.isOwner()||(dirty.has('club')&&!S.code))return;
  flushing=true;
  let failed=false;
  let tries=0;
  while(dirty.size&&!failed){
    try{await saveOne([...dirty][0])}
    catch(e){if(!e.conflict||++tries>=5)failed=true} // A conflict means another owner just saved. Read again and fold it in.
  }
  flushing=false;
  if(failed&&!store.isOwner()){ // The phone held on to the changes. They send after signing back in.
    S.owner=false;
    S.signInOpen=true;
    S.tab='club';
    toast('Your sign-in ended. Sign in again to save your changes.');
    render();
  }else if(failed){
    saveFailing=true;
    toast('Not saved yet. It will send when you have signal.',{retry:true});
  }else{
    toast('Saved',{quiet:!saveFailing});
    saveFailing=false;
  }
}
function cacheClub(){
  S.clubAt=Date.now();
  LS.set('cache:club',S.club);
  LS.set('cache:clubAt',S.clubAt);
}
function saveClub(){
  cacheClub();
  if(S.code)markDirty('club');
  render();
}
function savePub(){
  S.pubAt=Date.now();
  LS.set('cache:pub',S.pub);
  LS.set('cache:pubAt',S.pubAt);
  markDirty('pub');
  render();
}
let toastT=null, toastUntil=0;
function toast(msg,{retry=false,quiet=false}={}){
  if(quiet&&Date.now()<toastUntil)return;
  const el=document.getElementById('live');
  el.hidden=false;
  el.innerHTML=esc(msg)+(retry?' <button data-a="retry">Try now</button>':'');
  clearTimeout(toastT);
  if(retry){toastUntil=Infinity;return}
  const ms=Math.max(1800,msg.length*55);
  toastUntil=quiet?0:Date.now()+ms;
  toastT=setTimeout(()=>{el.hidden=true;toastUntil=0},ms);
}

/* ---------- Loading ---------- */
async function refreshPublic(){
  if(!store||dirty.has('pub'))return;
  const at=edits.pub;
  try{
    const p=await timed(store.get('public/site'));
    if(dirty.has('pub')||edits.pub!==at)return; // The owner changed something while this was loading.
    S.pub=normalizePub(p);
    setBase('pub',S.pub);
    S.pubReady=true;
    S.pubStale=false;
    S.pubAt=Date.now();
    LS.set('cache:pub',S.pub);
    LS.set('cache:pubAt',S.pubAt);
  }catch(e){S.pubStale=true}
}
async function refreshClub(){
  if(!store||!S.code||dirty.has('club'))return;
  const at=edits.club;
  try{
    const c=await timed(store.get('clubs/'+S.code));
    if(dirty.has('club')||edits.club!==at)return;
    if(!c){
      if(S.owner)await loadOwner(); // Another owner changed the code, so pick up the new one.
      else{
        forgetClub();
        S.joinErr='That club code has changed. Ask Jonathon for the new one.';
      }
      return;
    }
    S.club=normalizeClub(c);
    setBase('club',S.club);
    S.clubStale=false;
    cacheClub();
  }catch(e){S.clubStale=true}
}
function forgetClub(){
  S.code=null;
  S.club=null;
  LS.set('code',null);
  LS.set('cache:club',null);
  setMember(null);
}
async function loadOwner(){
  let o=await timed(store.get('owner/settings'));
  if(o&&o.retire){ // A code change got interrupted. Finish shutting off the old code.
    try{await timed(store.del('clubs/'+o.retire));o={code:o.code};await timed(store.set('owner/settings',o))}
    catch(e){o={code:o.code}}
  }
  if(!o||!o.code){ // First time signing in.
    o={code:newCode()};
    await timed(store.set('clubs/'+o.code,emptyClub()));
    await timed(store.set('owner/settings',o));
  }
  S.code=o.code;
  LS.set('code',o.code);
  if(dirty.has('club')&&S.club)return; // Unsaved changes on this phone win until they send.
  const c=await timed(store.get('clubs/'+S.code)); // A failed read throws, so a bad connection can never overwrite the club.
  if(c)S.club=normalizeClub(c);
  else{
    S.club=normalizeClub(S.club);
    await timed(store.set('clubs/'+S.code,S.club));
  }
  setBase('club',S.club);
  S.clubStale=false;
  cacheClub();
}
async function refreshAll(){
  if(!store)return;
  flush();
  if(S.memberDay<today())S.memberDay=nextDuckDay();
  const club=S.owner&&(!S.code||!S.club)?loadOwner().catch(()=>{S.clubStale=true}):refreshClub();
  await Promise.all([refreshPublic(),club]);
  S.loaded=true;
  render();
}
async function boot(){
  render();
  store=await pickStore();
  render();
  S.owner=store.isOwner();
  render();
  const club=S.owner
    ?loadOwner().catch(()=>{S.owner=store.isOwner();S.clubStale=true})
    :refreshClub();
  await Promise.all([refreshPublic(),club]);
  S.loaded=true;
  render();
  flush();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshAll()});
  addEventListener('online',refreshAll);
  setInterval(flush,20000);
  setInterval(()=>{ // Owners see each other's changes without having to reopen the app.
    const typing=document.activeElement&&document.activeElement.matches('input,textarea,select');
    if(S.owner&&!document.hidden&&!sheet&&!dirty.size&&!typing)refreshAll();
  },60000);
}

/* ---------- Views: hunts ---------- */
function statusBlock(){
  const t=today(), nextDuck=duckDays.find(d=>d>=t), nextHunt=huntDays.find(d=>d>=t);
  const away=d=>{const n=Math.round((parse(d)-parse(t))/864e5);return `${n} day${n===1?'':'s'}`};
  const block=(small,big,side='')=>`<div class="opener"><div><p class="mute small">${small}</p><b>${big}</b></div>${side?`<div class="days">${side}</div>`:''}</div>`;
  if(!nextHunt)return block('Season is closed','See you next fall');
  if(duckDays.includes(t))return block('Ducks and geese','Open now');
  if(gooseOnlyDays.includes(t))return block('Goose season','Open now',nextDuck?`Ducks open<br>${monthDay(nextDuck)}`:'');
  return block('Next hunts',fmt(nextHunt),`${away(nextHunt)}<br>out`);
}
function marksFor(hunts){ // One letter per hunt. Busier days roll up so they still fit in the square: D2 means 2 duck hunts open.
  const mark=(text,booked)=>`<i class="${booked?'x':''}">${text}</i>`;
  if(hunts.length<=3)return hunts.map(h=>mark(SPECIES[h.species].mark,h.status==='booked')).join('');
  const kinds=[...new Set(hunts.map(h=>h.species))];
  if(kinds.length>2)return mark(hunts.length);
  return kinds.map(k=>{
    const open=hunts.filter(h=>h.species===k&&h.status!=='booked').length;
    return open?mark(SPECIES[k].mark+open):mark(SPECIES[k].mark,true);
  }).join('');
}
function dayCell(s,n){
  const t=today(), current=s===t?' aria-current="date"':'';
  const shut=why=>`<button class="d closed" disabled aria-label="${fmt(s)}, ${why}"${current}>${n}</button>`;
  if(!huntDays.includes(s)||s<t)return shut('closed');
  if(!S.pubReady)return shut('checking');
  const manage=managing(), all=manage?huntsOn(s):offered(s), shown=all.filter(matchF);
  const open=shown.filter(h=>h.status!=='booked').length, booked=shown.length-open;
  if(!shown.length&&!manage)return shut(S.filter==='all'?'no hunts':`no ${SPECIES[S.filter].name} hunts`);
  const picked=!manage&&all.some(h=>S.picks.has(s+'|'+h.id));
  const state=picked?'pick':!all.length?'none':!shown.length?'closed':!open?'booked':booked?'part':'open';
  const opening=s===duckDays[0]?' opening':'';
  const say=!all.length?'no hunts set':`${open} open, ${booked} booked${picked?', picked':''}`;
  return `<button class="d ${state}${opening}" data-a="openDay" data-v="${s}" aria-label="${fmt(s)}, ${say}"${current}>${n}<span class="marks" aria-hidden="true">${marksFor(shown)}</span></button>`;
}
function monthBlock([y,m]){
  const name=new Date(y,m,1).toLocaleDateString('en-US',{month:'long',year:'numeric'});
  const lead=new Date(y,m,1).getDay(), count=new Date(y,m+1,0).getDate();
  let cells='';
  for(let i=0;i<lead;i++)cells+='<span></span>';
  for(let d=1;d<=count;d++)cells+=dayCell(`${y}-${pad(m+1)}-${pad(d)}`,d);
  return `<section class="month"><h3>${name}</h3><div class="grid">${['S','M','T','W','T','F','S'].map(x=>`<span class="dow" aria-hidden="true">${x}</span>`).join('')}${cells}</div></section>`;
}
function installBar(){
  if(!HOSTED||standalone()||S.installHidden)return '';
  return `<div class="installbar"><div class="grow"><b>Put this on your phone</b><span>Free. No app store, account, or email.</span></div>
    <button class="btn sm primary" data-a="install">${installEvt?'Install':'Show me'}</button>
    <button class="dismiss" data-a="hideInstall" aria-label="Hide this">&times;</button></div>`;
}

}
function legend(){
  const hasBoth=[S.pub.usual,...Object.values(S.pub.days)].some(l=>l.some(h=>h.species==='both'));
  const mark=(m,t,x)=>`<span><span class="marks"><i class="${x?'x':''}">${m}</i></span>${t}</span>`;

    <span><i class="swatch"></i>Open</span>

    ${mark('D','Duck')}${mark('G','Goose')}${hasBoth?mark('B','Both'):''}${mark('G','Booked',true)}
  </div>`;
}
function calendarNote(){
  if(!S.pubReady){
    if(!S.loaded)return `<p class="mute">Checking which hunts are open&hellip;</p>`;

function seasonDates(){

function ownerExtras(){
  const rows=[], left=huntDays.filter(d=>d>=today());
  let open=0;
  for(const d of left){
    for(const h of huntsOn(d)){
      if(h.status==='booked')rows.push(`<button class="rowlink" data-a="openDay" data-v="${d}"><b>${fmt(d)}</b><i>${esc(h.time)} ${SPECIES[h.species].name}${h.setup?', '+esc(h.setup.toLowerCase()):''}</i></button>`);
      else open++;
    }
  }
  const usual=S.pub.usual.length?[...S.pub.usual].sort(byTime).map(h=>esc(huntName(h))).join(', '):'No hunts set';
  return `<section class="panel"><h3>Your usual day</h3><p class="small mute">${usual}.</p><button class="btn" data-a="openDay" data-v="usual">Change my usual day</button></section>
  <section class="stack"><h3>Booked hunts (${rows.length})</h3><p class="small mute">${open} still open this season.</p>${rows.length?`<div class="splits">${rows.join('')}</div>`:''}</section>`;
}
function picksList(){
  const out=[];
  for(const k of [...S.picks].sort()){
    const[d,id]=k.split('|'), h=offered(d).find(x=>x.id===id);
    if(h&&h.status!=='booked')out.push({d,h});else S.picks.delete(k);
  }
  return out;
}
function pickBar(){

}

/* ---------- Sheets ---------- */
function sheetWrap(title,body){
  return `<div class="scrim" data-a="closeSheet"><div class="sheet" tabindex="-1" role="dialog" aria-modal="true" aria-label="${title}" data-stop><div class="row between" style="flex-wrap:nowrap"><h2>${title}</h2><button class="link" data-a="closeSheet" style="flex:none">Close</button></div>${body}</div></div>`;
}
const gooseNote=d=>gooseOnlyDays.includes(d)?`<p class="small mute">Specklebelly and snow geese only. Canada geese open ${monthDay(duckDays[0])}.</p>`:'';
function customerDaySheet(d){
  const hunts=labelled(offered(d)).filter(matchF);
  const anyPicked=hunts.some(h=>S.picks.has(d+'|'+h.id));
  const rows=hunts.map(h=>{
    const k=d+'|'+h.id, on=S.picks.has(k), b=h.status==='booked';
    return `<div class="hunt${b?' isbooked':''}"><div><b>${esc(h.label)}</b><span class="sub">${esc(h.setup||'Setup depends on where the birds are')}</span></div>${b?'<span class="pill">Booked</span>':`<button class="btn sm${on?' on':''}" data-a="pickHunt" data-v="${k}" aria-pressed="${on}" aria-label="${on?'Picked':'Pick'}: ${esc(h.label)}">${on?'Picked':'Pick'}</button>`}</div>`;
  }).join('');
  return sheetWrap(fmt(d,{weekday:'long',month:'short',day:'numeric'}),`${gooseNote(d)}<div>${rows||'<p class="mute">No hunts left this day.</p>'}</div><button class="btn wide${anyPicked?' primary':''}" data-a="closeSheet">Done</button>`);
}
function huntEditor(h,d){
  return `<div class="hedit">
    <label for="ht-${h.id}">Time<select id="ht-${h.id}" data-c="hTime" data-id="${h.id}">${Object.keys(TIMES).map(t=>`<option${t===h.time?' selected':''}>${t}</option>`).join('')}</select></label>

  </div>`;
}
function manageDaySheet(d){
  const usual=d==='usual';
  const hunts=labelled(usual?[...S.pub.usual].sort(byTime):huntsOn(d));
  const rows=hunts.map(h=>{
    const b=h.status==='booked', ed=sheet.edit===h.id;

    ?`<p class="small mute">These fill every legal day you haven't changed. Duck hunts stay off goose-only days.${changed?` The ${changed===1?'day':changed+' days'} you've already changed keep${changed===1?'s':''} ${changed===1?'its':'their'} own hunts.`:''}</p>`

function addSheet(){

    ?(cur?`<button class="btn grow" data-a="moveTo" data-v="0">Take off blind</button>`:'')

function installSheet(){

  if(IN_APP_BROWSER.test(ua))return sheetWrap('Open it in your browser first',`<p>Facebook and other apps can't add this to your home screen from inside their own browser.</p>
    <ol class="steps"><li>Tap the menu (<b>&hellip;</b>) at the top or bottom of this screen.</li><li>Tap <b>Open in browser</b> or <b>Open in Safari</b>.</li><li>Tap <b>Show me</b> again there.</li></ol>
    ${link}<button class="btn wide" data-a="copyLink">Copy the link instead</button>`);
  if(isIOS())return sheetWrap('Add it to your iPhone',`<ol class="steps"><li>Tap the <b>Share</b> button, the square with an arrow pointing up. On newer iPhones, tap the <b>three dots</b> first, then <b>Share</b>.</li><li>Scroll down and tap <b>Add to Home Screen</b>.</li><li>Leave <b>Open as Web App</b> on if you see it, then tap <b>Add</b>.</li></ol>
    <p class="small mute">Don't see it? Open this page in Safari and try again.</p><button class="btn wide" data-a="closeSheet">Done</button>`);
  if(/android/i.test(ua))return sheetWrap('Add it to your phone',`<ol class="steps"><li>Tap your browser's menu. In Chrome that's the three dots at the top.</li><li>Tap <b>Install app</b> or <b>Add to Home screen</b>.</li><li>Tap <b>Install</b> or <b>Add</b> to finish.</li></ol><button class="btn wide" data-a="closeSheet">Done</button>`);
  return sheetWrap('Open this on your phone',`<p>This app is made for phones. Open this link on your phone, then come back to this step.</p>${link}<button class="btn wide" data-a="copyLink">Copy the link</button>`);
}
function textSheet(){
  return sheetWrap(esc(sheet.title),`<p class="small mute">Press and hold to copy this.</p><textarea id="copytext" readonly>${esc(sheet.text)}</textarea><button class="btn wide" data-a="closeSheet">Done</button>`);
}
function sheetView(){
  if(!sheet)return '';
  switch(sheet.type){
    case 'day':return managing()?manageDaySheet(sheet.d):customerDaySheet(sheet.d);
    case 'add':return addSheet();
    case 'move':return moveSheet();
    case 'member':return memberSheet();
    case 'install':return installSheet();
    case 'text':return textSheet();
  }
  return '';
}

/* ---------- Drawing the screen ---------- */
const keyOf=el=>{
  if(!el||el===document.body)return null;
  if(el.dataset&&el.dataset.a)return `[data-a="${el.dataset.a}"]`+(el.dataset.v!==undefined?`[data-v="${el.dataset.v}"]`:'');
  return el.id?'#'+el.id:null;
};
let sheetInHistory=false;
function syncHistory(){ // Lets the phone's back button close a sheet instead of leaving the app.
  if(!HOSTED)return;
  if(sheet&&!sheetInHistory){history.pushState({roostSheet:1},'');sheetInHistory=true}
  else if(!sheet&&sheetInHistory){sheetInHistory=false;history.back()}
}
function paint(){
  const key=keyOf(document.activeElement);
  const kept={};
  document.querySelectorAll('#app input[id],#app textarea[id]').forEach(el=>{kept[el.id]=el.value});
  const prev=document.querySelector('.sheet'), sheetTop=prev?prev.scrollTop:0;
  const shield=sheet?' inert':'';
  document.getElementById('app').innerHTML=`
  <header class="top"${shield}><div class="wrap"><div class="mark">The Roost Hole<small>Guide Service, Stuttgart, Arkansas</small></div><a class="call" href="tel:${PHONE}">Call</a></div></header>
  <main class="wrap"${shield}>${S.tab==='hunts'?huntsView():clubView()}</main>
  <div${shield}>${pickBar()}</div>
  <nav class="tabs" aria-label="Main"${shield}><div class="wrap"><button data-a="tab" data-v="hunts" ${S.tab==='hunts'?'aria-current="page"':''}>Hunts</button><button data-a="tab" data-v="club" ${S.tab==='club'?'aria-current="page"':''}>Duck Club</button></div></nav>
  ${sheetView()}`;
  for(const id in kept){const el=document.getElementById(id);if(el)el.value=kept[id]}
  document.body.classList.toggle('locked',!!sheet);
  const now=document.querySelector('.sheet');
  if(now&&prev){now.classList.add('noanim');now.scrollTop=sheetTop}
  const again=key&&document.querySelector(key);
  if(now&&!prev)now.focus({preventScroll:true});
  else if(!now&&prev&&opener){const el=document.querySelector(opener);if(el)el.focus({preventScroll:true});opener=null}
  else if(again)again.focus({preventScroll:true});
  syncHistory();
}
function render(){
  try{paint()}
  catch(e){
    console.error(e);
    document.getElementById('app').innerHTML=`<main class="wrap"><h1>The Roost Hole</h1><p>Something went wrong opening the app. Call or text Jonathon at <a href="tel:${PHONE}">${PHONE_TXT}</a>.</p><button class="btn" data-a="resetApp">Reset the app on this phone</button></main>`;
  }
}

/* ---------- Actions ---------- */
async function copy(text,ok,title){
  try{await navigator.clipboard.writeText(text);toast(ok)}
  catch(e){sheet={type:'text',title,text}}
}
const actions={
  tab(v){S.tab=v;LS.set('tab',v);S.confirm=null;scrollTo(0,0)},
  huntView(v){S.huntView=v},
  setFilter(v){S.filter=v},
  openDay(v){sheet={type:'day',d:v,edit:null}},
  pickHunt(v){S.picks.has(v)?S.picks.delete(v):S.picks.add(v);LS.set('picks',[...S.picks])},
  setStatus(v){const[id,st]=v.split('|'),h=findHunt(id);if(h){h.status=st;saveHunts()}},
  allStatus(v){dayList(sheet.d).forEach(h=>{h.status=v});saveHunts()},
  editHunt(v){sheet.edit=v||null},
  addHunt(){
    const d=sheet.d, h={id:newId(),time:'Morning',species:legal('duck',d)?'duck':'goose',setup:''};
    if(d!=='usual')h.status='open';
    dayList(d).push(h);
    sheet.edit=h.id;
    saveHunts();
  },
  rmHunt(v){
    const l=dayList(sheet.d), i=l.findIndex(x=>x.id===v);
    if(i>=0)l.splice(i,1);
    sheet.edit=null;
    saveHunts();
  },
  setSpecies(v){const[id,sp]=v.split('|'),h=findHunt(id);if(h&&legal(sp,sheet.d)){h.species=sp;saveHunts()}},
  clearPicks(){S.picks.clear();LS.set('picks',null)},
  async copyPicks(){await copy(picksMsg(),`Message copied. Paste it into a text to ${PHONE_TXT}.`,'Text this to '+PHONE_TXT)},
  async install(){
    if(installEvt){
      installEvt.prompt();
      await installEvt.userChoice.catch(()=>{});
      installEvt=null;
    }else sheet={type:'install'};
  },
  hideInstall(){S.installHidden=true;LS.set('installHidden',true)},
  async copyLink(){const url=appUrl();sheet=null;await copy(url,'Link copied. Paste it into your browser.','The app link')},
  iAm(v){setMember(v);S.memberDay=nextDuckDay()},
  switchMember(){setMember(null)},
  leave(){forgetClub();S.joinErr=''},
  memberDay(v){if(v)S.memberDay=v},
  openSignIn(){S.signInOpen=true},
  async signOut(){
    if(dirty.size){toast('You have changes still waiting to save. Get signal and try again.');return}
    await store.signOut();
    S.owner=false;
    S.ownerView='blinds';
    S.huntView='manage';
    S.signInOpen=false;
    bases.pub=bases.club=null;
    LS.set('base:pub',null);
    LS.set('base:club',null);
    forgetClub();
  },
  ownerView(v){S.ownerView=v;S.confirm=null;scrollTo(0,0)},
  addTo(v){
    const n=Number(v), day=S.scope, rank=m=>{const b=blindOn(m.id,day);return b===n?0:b?2:1}; // This blind, then free, then on other blinds.
    sheet={type:'add',n,order:[...S.club.members].sort((a,b)=>rank(a)-rank(b)).map(m=>m.id)};
  },
  moveMember(v){sheet={type:'move',id:v}},
  editMember(v){S.confirm=null;sheet={type:'member',id:v}},
  closeSheet(){sheet=null;S.confirm=null},
  gotoRoster(){sheet=null;S.ownerView='roster'},
  assignHere(v){assign(v,blindOn(v,S.scope)===sheet.n?0:sheet.n)}, // The sheet stays open so several names can be tapped in a row.
  moveTo(v){assign(sheet.id,Number(v));sheet=null},
  backToSeason(){clearOverride(sheet.id,S.scope);sheet=null},
  blindCount(v){
    const c=S.club, d=Number(v);
    if(d>0&&c.blinds>=MAX_BLINDS)return;
    if(d<0){
      if(c.blinds<=1)return;
      const used=c.members.some(m=>seasonBlind(m.id)===c.blinds||Object.values(c.days).some(x=>x[m.id]===c.blinds));
      if(used){toast(`Blind ${c.blinds} has hunters on it. Move them first.`);return}
    }
    c.blinds+=d;
    saveClub();
  },
  clearSamples(){S.club.members.filter(m=>m.sample).forEach(m=>removeMember(m.id))},
  askConfirm(v){S.confirm=v},
  rmMember(v){removeMember(v);S.confirm=null;sheet=null},
  async copyInvite(){
    if(!HOSTED)await copy(S.code,'Club code copied.','Club code');
    else await copy(`Duck club members: get the Roost Hole app at ${appUrl()} and add it to your home screen. Then open the Duck Club tab and enter this code: ${S.code}`,'Text copied. Paste it to your members.','Send this to your members');
  },
  async rotateCode(){
    if(flushing||dirty.size){toast('Still saving your last change. Try again in a moment.');return}
    const code=newCode();
    let old=S.code;
    try{
      const o=await timed(store.get('owner/settings'));
      if(o&&o.code&&o.code!==old){ // Another owner already changed it.
        await loadOwner();
        S.confirm=null;
        toast('Another owner just changed the code. This is the new one.');
        return;
      }
      const latest=await timed(store.get('clubs/'+old)); // Bring along anything another owner just changed.
      if(latest)S.club=normalizeClub(latest);
      await timed(store.set('clubs/'+code,S.club));
      await timed(store.set('owner/settings',{code,retire:old}));
    }catch(e){toast('The code did not change. Check your signal and try again.');return}
    setBase('club',S.club);
    S.code=code;
    LS.set('code',code);
    S.confirm=null;
    toast('New code is live. Send it to your members.');
    try{ // If this part fails, the app finishes it the next time the owner opens it.
      await timed(store.del('clubs/'+old));
      await timed(store.set('owner/settings',{code}));
    }catch(e){}
  },
  retry(){document.getElementById('live').hidden=true;toastUntil=0;flush()},
  async reload(){await refreshAll()},
  resetApp(){
    try{Object.keys(localStorage).filter(k=>k.startsWith('roost.')).forEach(k=>localStorage.removeItem(k))}catch(e){}
    location.reload();
  }
};
document.addEventListener('click',async e=>{
  const t=e.target.closest('[data-a]');
  if(!t)return;
  if(t.classList.contains('scrim')&&e.target.closest('[data-stop]'))return;
  const f=actions[t.dataset.a];
  if(!f)return;
  if(!sheet)opener=keyOf(t);
  try{await f(t.dataset.v)}
  finally{render()}
});
document.addEventListener('change',e=>{
  const c=e.target.dataset.c;
  if(c==='scope'){S.scope=e.target.value;render()}
  if(c==='hTime'||c==='hSetup'){
    const h=findHunt(e.target.dataset.id);
    if(h){h[c==='hTime'?'time':'setup']=e.target.value;saveHunts()}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet){sheet=null;S.confirm=null;render()}});
document.addEventListener('focusin',e=>{if(e.target.id==='copytext')e.target.select()});
addEventListener('popstate',()=>{
  if(!sheetInHistory)return;
  sheetInHistory=false;
  sheet=null;
  S.confirm=null;
  render();
});
const forms={
  async join(){
    const code=normCode(document.getElementById('clubcode').value);
    if(!code)return;
    S.joinErr='';
    S.busy='join';
    render();
    try{
      const c=/^[A-Z0-9_-]{1,60}$/.test(code)?await timed(store.get('clubs/'+code)):null;
      if(!c)S.joinErr='That code didn\'t work. Check it with Jonathon and try again.';
      else{
        S.code=code;
        S.club=normalizeClub(c);
        S.clubStale=false;
        LS.set('code',code);
        cacheClub();
      }
    }catch(err){S.joinErr='No signal right now. Try again when you have service.'}
    S.busy=null;
  },
  async signin(){
    S.signInErr='';
    S.busy='signin';
    render();
    try{
      await store.signIn(document.getElementById('ocode').value.toLowerCase().replace(/\s+/g,'')); // Capitals and stray spaces don't matter.
      await loadOwner();
      await refreshPublic();
      S.owner=true;
      S.signInOpen=false;
      S.ownerView='blinds';
      S.huntView='manage';
      flush();
    }catch(err){
      await store.signOut();
      S.owner=false;
      if(err.message==='signin')S.signInErr='That code didn\'t work. Check it and try again.';
      else if(err.status)S.signInErr='The code worked, but the app can\'t open the club data. Check steps 1 and 2 in SETUP.txt.';
      else S.signInErr='Couldn\'t reach the club data. Check your signal and try again.';
    }
    S.busy=null;
  },
  addMembers(){
    const box=document.getElementById('newnames');
    const names=box.value.split('\n').map(s=>s.trim().replace(/\s+/g,' ')).filter(Boolean);
    if(!names.length){toast('Type at least one name.');return}
    const have=new Set(S.club.members.map(m=>m.name.toLowerCase()));
    let added=0;
    for(const raw of names){
      const name=raw.slice(0,40);
      if(have.has(name.toLowerCase()))continue;
      have.add(name.toLowerCase());
      S.club.members.push({id:newId(),name});
      added++;
    }
    box.value='';
    if(added)saveClub();
    toast(added?`Added ${added}. Now put them on blinds.`:'Those names are already on the list.');
  },
  renameMember(){
    const m=S.club.members.find(x=>x.id===sheet.id), name=document.getElementById('mname').value.trim().replace(/\s+/g,' ');
    if(!m||!name)return;
    if(S.club.members.some(x=>x.id!==m.id&&x.name.toLowerCase()===name.toLowerCase())){toast('Someone already has that name. Add a last initial.');return}
    m.name=name;
    delete m.sample;
    sheet=null;
    saveClub();
  }
};
document.addEventListener('submit',async e=>{
  const f=forms[e.target.dataset.f];
  if(!f)return;
  e.preventDefault();
  try{await f()}
  finally{render()}
});
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvt=e;render()});
addEventListener('appinstalled',()=>{installEvt=null;S.installHidden=true;render()});
boot();
</script>

<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
